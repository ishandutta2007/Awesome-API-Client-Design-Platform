<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d17"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="glow-purple" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="glow-pink" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".3"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="badge-grad-1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".3"/><stop offset="100%" stop-color="#0369a1" stop-opacity=".1"/></linearGradient><linearGradient id="badge-grad-2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#7c3aed" stop-opacity=".3"/><stop offset="100%" stop-color="#6d28d9" stop-opacity=".1"/></linearGradient><linearGradient id="badge-grad-3" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#059669" stop-opacity=".3"/><stop offset="100%" stop-color="#047857" stop-opacity=".1"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulse1{0%{transform:scale(.9) translate(-20px,0);opacity:.6}}@keyframes pulse2{0%{transform:scale(1.1) translate(10px,-20px);opacity:.7}}@keyframes pulse3{0%{transform:scale(.95) translate(0,15px);opacity:.5}}@keyframes float{0%{transform:translateY(0)}}.pulse-cyan{animation:pulse1 6s ease-in-out infinite alternate}.pulse-purple{animation:pulse2 7s ease-in-out infinite alternate}.pulse-pink{animation:pulse3 5s ease-in-out infinite alternate}.flow-line{stroke-dasharray:8 12;animation:dash 25s linear infinite}.flow-node{animation:float 4s ease-in-out infinite alternate}</style></defs><rect width="100%" height="100%" fill="url(#bg-grad)"/><circle cx="200" cy="120" r="220" fill="url(#glow-cyan)" class="pulse-cyan"/><circle cx="1020" cy="180" r="260" fill="url(#glow-purple)" class="pulse-purple"/><circle cx="600" cy="360" r="180" fill="url(#glow-pink)" class="pulse-pink"/><rect width="100%" height="100%" fill="url(#grid)"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 0 80 Q 300 140 600 70 T 1200 90" class="flow-line"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 0 340 Q 400 280 800 350 T 1200 310" class="flow-line"/></g><g class="flow-node" opacity=".6"><rect width="130" height="42" x="70" y="240" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="8"/><text x="135" y="266" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">REST &amp; OpenAPI</text></g><g class="flow-node" opacity=".6" style="animation-delay:-2s"><rect width="130" height="42" x="1000" y="240" fill="#1e293b" stroke="#c084fc" stroke-width="1" rx="8"/><text x="1065" y="266" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">GraphQL • gRPC</text></g><g transform="translate(600, 75)"><rect width="280" height="32" x="-140" y="-16" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><circle cx="-115" cy="0" r="5" fill="#10b981"/><text x="10" y="5" fill="#94a3b8" font-family="-